fullnameOverride: aiproxy-web

replicas: 2
resources:
  requests:
    cpu: 50m
    memory: 50Mi
  limits:
    cpu: 500m
    memory: 512Mi

image: ghcr.io/labring/sealos-aiproxy-frontend:latest

startupProbe:
  httpGet:
    path: /livez
    port: http
  periodSeconds: 5
  failureThreshold: 24
  timeoutSeconds: 3

livenessProbe:
  httpGet:
    path: /livez
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3

readinessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 3

cloudDomain: 127.0.0.1.nip.io
cloudPort: ""
httpPort: ""
disableHttps: false
certSecretName: "wildcard-cert"

suffix:

aiproxy:
  AI_PROXY_BACKEND_KEY: ""
  APP_TOKEN_JWT_KEY: ""
  AI_PROXY_BACKEND_INTERNAL: "http://aiproxy.aiproxy-system.svc:3000"
  ADMIN_NAMESPACES: "ns-admin"
  ACCOUNT_SERVER_TOKEN_JWT_KEY: ""
  CURRENCY_SYMBOL: ""
  NODE_TLS_REJECT_UNAUTHORIZED: "1"
  ACCOUNT_SERVER: "http://account-service.account-system.svc:2333"
  IS_INVITATION_ACTIVE: "false"
  DOC_URL: "https://sealos.run/docs/guides/ai-proxy"
