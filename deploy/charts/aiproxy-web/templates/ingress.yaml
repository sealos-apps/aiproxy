{{- $embeddedAllowedOrigins := join " " .Values.aiproxy.embeddedAllowedOrigins -}}
{{- $cloudOrigin := printf "%s://%s%s" (include "aiproxy.scheme" .) .Values.cloudDomain (include "aiproxy.externalPortSuffix" .) -}}
{{- $wildcardCloudOrigin := printf "%s://*.%s%s" (include "aiproxy.scheme" .) .Values.cloudDomain (include "aiproxy.externalPortSuffix" .) -}}
{{- range $origin := .Values.aiproxy.embeddedAllowedOrigins }}
{{- $parsedOrigin := urlParse $origin -}}
{{- if or (not (or (eq $parsedOrigin.scheme "http") (eq $parsedOrigin.scheme "https"))) (eq $parsedOrigin.host "") (contains "*" $origin) (ne $origin (printf "%s://%s" $parsedOrigin.scheme $parsedOrigin.host)) }}
{{- fail "aiproxy.embeddedAllowedOrigins entries must be exact HTTP(S) origins without wildcards, paths, queries, fragments, or credentials" }}
{{- end }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: {{.Release.Namespace}}
  name: {{ include "aiproxy.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: 32m
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
    nginx.ingress.kubernetes.io/backend-protocol: HTTP
    nginx.ingress.kubernetes.io/client-body-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-buffer-size: 64k
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_clear_headers "X-Frame-Options:";
      more_set_headers "Content-Security-Policy: frame-ancestors 'self' {{ $cloudOrigin }} {{ $wildcardCloudOrigin }}{{ if $embeddedAllowedOrigins }} {{ $embeddedAllowedOrigins }}{{ end }}";
    higress.io/response-header-control-remove: X-Frame-Options
    higress.io/response-header-control-update: |
      Content-Security-Policy "frame-ancestors 'self' {{ $cloudOrigin }} {{ $wildcardCloudOrigin }}{{ if $embeddedAllowedOrigins }} {{ $embeddedAllowedOrigins }}{{ end }}"
    nginx.ingress.kubernetes.io/server-snippet: |
      client_header_buffer_size 64k;
      large_client_header_buffers 4 128k;
spec:
  rules:
    - host: {{ include "aiproxy.webHost" . | quote }}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: {{ include "aiproxy.fullname" . }}
                port:
                  number: 3000
  {{- if not (eq (toString .Values.disableHttps) "true") }}
  tls:
    - hosts:
        - {{ include "aiproxy.webHost" . | quote }}
      secretName: {{ .Values.certSecretName | quote }}
  {{- end }}
